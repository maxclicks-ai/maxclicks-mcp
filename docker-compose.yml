version: '3.8'

services:
  maxclicks-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: maxclicks-mcp:latest
    container_name: maxclicks-mcp
    restart: unless-stopped
    ports:
      - "7004:7004"
    environment:
      - NODE_ENV=production
      - MAXCLICKS_RETRY_MAX_ATTEMPTS=3
      - MAXCLICKS_RETRY_INITIAL_DELAY=1000
      - MAXCLICKS_RETRY_MAX_DELAY=10000
      - MAXCLICKS_RETRY_BACKOFF_FACTOR=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7004/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
